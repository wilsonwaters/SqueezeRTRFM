name: Release

# Builds RTRFM-<version>.zip from RTRFM/install.xml's <version>, creates the tag and GitHub
# Release v<version> with the zip attached, checks the uploaded asset, then points repo.xml on
# main at it. The release always comes before the repo.xml commit, so repo.xml never names an
# asset that doesn't exist; if a run stops in between, the next run repairs repo.xml from the
# existing asset. Dry runs (pull requests, or dispatch with dry_run) build and show everything
# but create no release, tag or commit. See RELEASING.md.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (build and show the repo.xml change; create no release, tag or commit)
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['RTRFM/install.xml']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/build.sh'
      - 'scripts/update-repo-xml.pl'
      - 'repo.xml'

permissions:
  contents: write

# Real releases share one group and a running one is never cancelled, so two runs for one
# version are serialised and the second finds the release and does nothing. (GitHub keeps only
# the newest waiting run of a group, which was started for the newest commit.) Dry runs get a
# group of their own and never wait for, or hold up, a real release.
concurrency:
  group: ${{ (github.event_name == 'pull_request' || inputs.dry_run) && format('release-dry-run-{0}', github.run_id) || 'release' }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: CI checks
    uses: ./.github/workflows/ci.yml

  release:
    name: Build and release
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DRY_RUN: ${{ github.event_name == 'pull_request' || inputs.dry_run == true }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # ---- 1. check out (CI checks already passed in the job above), read the version ----
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zip unzip libxml2-utils

      - name: Read version
        run: |
          V="$(sed -n 's|.*<version>\(.*\)</version>.*|\1|p' RTRFM/install.xml | head -n 1)"
          if [[ ! "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=RTRFM/install.xml::<version> is '$V'; it must be X.Y.Z (digits only, no prefix or suffix)"
            exit 1
          fi
          if [[ "$DRY_RUN" != true && "$GITHUB_REF" != refs/heads/main ]]; then
            echo "::error::real releases run from main only (this run is on $GITHUB_REF); use dry_run to test other branches"
            exit 1
          fi
          {
            echo "V=$V"
            echo "ZIP_NAME=RTRFM-$V.zip"
            echo "ASSET_URL=https://github.com/$GITHUB_REPOSITORY/releases/download/v$V/RTRFM-$V.zip"
          } >> "$GITHUB_ENV"
          echo "Version: $V"
          echo "Zip: RTRFM-$V.zip"
          echo "Dry run: $DRY_RUN (event: $GITHUB_EVENT_NAME, ref: $GITHUB_REF, commit: $GITHUB_SHA)"

      # ---- 2. guards: no downgrade; a tag without a release needs a human ----
      - name: Guards
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          main_version="$(git show origin/main:repo.xml 2>/dev/null |
            xmllint --xpath 'string(/extensions/plugins/plugin[@name="RTRFM"]/@version)' - 2>/dev/null || true)"
          if [[ -z "$main_version" && "$DRY_RUN" != true ]]; then
            echo "::error::repo.xml on main has no RTRFM plugin entry to update; fix repo.xml on main before releasing"
            exit 1
          elif [[ -z "$main_version" ]]; then
            echo "repo.xml on main has no RTRFM entry yet (dry run); nothing to compare against"
          elif [[ "$main_version" != "$V" && "$(printf '%s\n%s\n' "$V" "$main_version" | sort -V | head -n 1)" == "$V" ]]; then
            echo "::error::version $V is lower than $main_version in repo.xml on main; releases never go backwards"
            exit 1
          else
            echo "repo.xml on main is at $main_version; $V is not a downgrade"
          fi

          if out="$(gh release view "v$V" --json tagName,url 2>&1)"; then
            release_exists=true
          elif [[ "$out" == *"release not found"* || "$out" == *"HTTP 404"* ]]; then
            release_exists=false
          else
            echo "::error::could not look up release v$V: $out"
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null; then
            tag_exists=true
          else
            rc=$?
            if [[ $rc -ne 2 ]]; then echo "::error::git ls-remote failed ($rc)"; exit 1; fi
            tag_exists=false
          fi

          echo "release v$V exists: $release_exists; tag v$V exists: $tag_exists"
          if [[ "$tag_exists" == true && "$release_exists" == false ]]; then
            echo "::error::tag v$V exists but has no GitHub Release. Resolve it by hand (delete the tag, or create the release from it), then re-run. See RELEASING.md, Troubleshooting."
            exit 1
          fi
          echo "RELEASE_EXISTS=$release_exists" >> "$GITHUB_ENV"

      # ---- 3. release exists: no-op, or repair repo.xml from the existing asset ----
      - name: Existing release (no-op or repair)
        if: env.RELEASE_EXISTS == 'true'
        run: |
          dir="$RUNNER_TEMP/existing"
          mkdir -p "$dir"
          if ! gh release download "v$V" --pattern "$ZIP_NAME" --dir "$dir"; then
            echo "::error::release v$V exists but its asset $ZIP_NAME could not be downloaded; fix the release by hand (never replace an asset: bump the version instead)"
            exit 1
          fi
          sha="$(sha1sum "$dir/$ZIP_NAME" | cut -d' ' -f1)"
          echo "Release v$V already exists; its $ZIP_NAME has sha1 $sha. It is not rebuilt or re-uploaded."

          xml="$(git show origin/main:repo.xml 2>/dev/null || true)"
          xp() { xmllint --xpath "$1" - <<<"$xml" 2>/dev/null || true; }
          main_version="$(xp 'string(/extensions/plugins/plugin[@name="RTRFM"]/@version)')"
          main_url="$(xp 'normalize-space(/extensions/plugins/plugin[@name="RTRFM"]/url)')"
          main_sha="$(xp 'normalize-space(/extensions/plugins/plugin[@name="RTRFM"]/sha)')"
          echo "repo.xml on main: version $main_version, url $main_url, sha $main_sha"

          if [[ "$main_version" == "$V" && "$main_url" == "$ASSET_URL" && "$main_sha" == "$sha" ]]; then
            echo "nothing to do: release v$V exists and repo.xml on main already points at it"
            echo "ACTION=none" >> "$GITHUB_ENV"
          else
            echo "repo.xml on main is stale; it will be updated from the existing asset (repair)"
            { echo "ACTION=repair"; echo "SHA=$sha"; echo "ZIP=$dir/$ZIP_NAME"; } >> "$GITHUB_ENV"
          fi

      # ---- 4. build once; the sha1 is taken from that exact file and it is never re-zipped ----
      - name: Build
        if: env.RELEASE_EXISTS == 'false'
        run: |
          scripts/build.sh --out dist
          zip="dist/$ZIP_NAME"
          sha="$(cut -d' ' -f1 "$zip.sha1")"
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then echo "::error::bad sha1 file for $zip"; exit 1; fi
          { echo "ACTION=release"; echo "SHA=$sha"; echo "ZIP=$zip"; } >> "$GITHUB_ENV"

      - name: Show package
        if: env.ACTION != 'none'
        run: |
          echo "Version: $V"
          echo "Zip:     $ZIP_NAME"
          echo "SHA1:    $SHA"
          echo "Action:  $ACTION (dry run: $DRY_RUN)"
          unzip -l "$ZIP"

      # ---- 5. tag + release, created server-side on the built commit (never a git tag push) ----
      - name: Create release
        if: env.ACTION == 'release' && env.DRY_RUN != 'true'
        run: |
          if ! gh release create "v$V" "$ZIP" --target "$GITHUB_SHA" --title "RTRFM $V" --generate-notes; then
            echo "::error::creating release v$V failed. A 403 means GITHUB_TOKEN is read-only: see RELEASING.md, Prerequisites (Settings > Actions > General > Workflow permissions > Read and write)."
            exit 1
          fi

      # ---- 6. the asset GitHub serves must be the file that was hashed ----
      - name: Verify uploaded asset
        if: env.ACTION == 'release' && env.DRY_RUN != 'true'
        run: |
          dir="$RUNNER_TEMP/uploaded"
          mkdir -p "$dir"
          for attempt in 1 2 3; do
            gh release download "v$V" --pattern "$ZIP_NAME" --dir "$dir" --clobber && break
            [[ $attempt -eq 3 ]] && { echo "::error::could not download the uploaded $ZIP_NAME"; exit 1; }
            sleep 5
          done
          got="$(sha1sum "$dir/$ZIP_NAME" | cut -d' ' -f1)"
          if [[ "$got" != "$SHA" ]]; then
            echo "::error::uploaded asset sha1 $got differs from the built zip's $SHA; repo.xml was not changed"
            exit 1
          fi
          echo "uploaded asset sha1 $got matches the built zip"

      # ---- 7. point repo.xml at the release, on top of the latest main ----
      - name: Update repo.xml
        if: env.ACTION != 'none'
        run: |
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            echo "pull request dry run: applying to the checked-out merge commit"
          else
            git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
            git checkout -B release-repo-xml origin/main
            main_version="$(xmllint --xpath 'string(/extensions/plugins/plugin[@name="RTRFM"]/@version)' repo.xml 2>/dev/null || true)"
            if [[ -n "$main_version" && "$main_version" != "$V" && "$(printf '%s\n%s\n' "$V" "$main_version" | sort -V | head -n 1)" == "$V" ]]; then
              echo "::error::repo.xml on main moved to $main_version, newer than $V; not overwriting it"
              exit 1
            fi
          fi
          scripts/update-repo-xml.pl --version "$V" --sha "$SHA" --url "$ASSET_URL"
          xmllint --noout repo.xml
          echo "---- git diff repo.xml ----"
          git --no-pager diff -- repo.xml
          {
            echo "### RTRFM $V ($([[ "$DRY_RUN" == true ]] && echo "dry run, nothing published" || echo "$ACTION"))"
            echo
            echo "- Zip: \`$ZIP_NAME\`"
            echo "- SHA1: \`$SHA\`"
            echo "- Asset URL: $ASSET_URL"
            echo
            echo '```diff'
            git --no-pager diff -- repo.xml
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push repo.xml
        if: env.ACTION != 'none' && env.DRY_RUN != 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            if git diff --quiet -- repo.xml; then
              echo "repo.xml on main already points at v$V; nothing to commit"
              exit 0
            fi
            git add repo.xml
            git commit -m "Release v$V: update repo.xml [skip ci]"
            if out="$(git push origin HEAD:refs/heads/main 2>&1)"; then
              echo "$out"
              echo "pushed repo.xml for v$V to main"
              exit 0
            fi
            echo "$out"
            if [[ "$out" == *403* || "$out" == *"denied"* || "$out" == *"protected branch"* ]]; then
              echo "::error::push to main refused. See RELEASING.md, Prerequisites: GITHUB_TOKEN needs Read and write, and branch protection must let github-actions[bot] push repo.xml. Re-run the workflow afterwards; it repairs repo.xml from the existing release."
              exit 1
            fi
            if [[ $attempt -eq 4 ]]; then break; fi
            echo "push rejected (main moved?); re-applying on the latest main, retry $attempt of 3"
            sleep $((attempt * 2))
            git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
            git reset --hard origin/main
            main_version="$(xmllint --xpath 'string(/extensions/plugins/plugin[@name="RTRFM"]/@version)' repo.xml 2>/dev/null || true)"
            if [[ -n "$main_version" && "$main_version" != "$V" && "$(printf '%s\n%s\n' "$V" "$main_version" | sort -V | head -n 1)" == "$V" ]]; then
              echo "::error::repo.xml on main moved to $main_version, newer than $V; not overwriting it"
              exit 1
            fi
            scripts/update-repo-xml.pl --version "$V" --sha "$SHA" --url "$ASSET_URL"
            xmllint --noout repo.xml
          done
          echo "::error::could not push repo.xml after 3 retries; re-run the workflow to repair it"
          exit 1
