name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # libxml2-utils: xmllint. libhtml-parser-perl: HTML::Entities, which LMS bundles, so the
      # tests also cover that decoding path. Everything else is core Perl or a t/lib stub/shim.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxml2-utils libhtml-parser-perl

      - name: Run scripts/check.sh
        run: scripts/check.sh
